<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 176" width="960" height="176" role="img" aria-labelledby="t d" fill="none">
<title id="t">By the numbers</title>
<desc id="d">By the numbers, from git and the GitHub API on 28 October 2026: 5 deployed systems whose first commit is mine; 47% of my commits also change a test file; 3,048 commits to main branches in the last 12 months across 34 repositories; 1,056 merged pull requests authored, across all repositories.</desc>
<defs><style>.s{font-family:"Inter Tight",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.k{font-size:11px;letter-spacing:1.4px;fill:#4f5a53}.v{font-size:42px;font-weight:700;fill:#080b09;font-variant-numeric:tabular-nums}.l{font-size:13.5px;fill:#4f5a53}.f{font-size:11px;letter-spacing:1.2px;fill:#4f5a53;text-anchor:middle}@keyframes kpUp{from{opacity:0;transform:translateY(6px)}}@keyframes kpBlink{50%{opacity:.25}}@media (prefers-reduced-motion:no-preference){.tl{animation:kpUp .55s cubic-bezier(.16,1,.3,1) both}.led{animation:kpBlink .4s 1s both}.d0{animation-delay:0.05s}.d1{animation-delay:0.15s}.d2{animation-delay:0.25s}.d3{animation-delay:0.35s}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect x=".5" y=".5" width="959" height="175" rx="14" fill="#f2f5ef" stroke="#a7b3aa"/>
<g class="tl d0"><rect x="24.5" y="20.5" width="218" height="123" rx="10" fill="#ffffff" stroke="#c9d2cb"/><circle class="led" cx="44" cy="42" r="3.5" fill="#067a45"/><text class="m k" x="56" y="46">FIRST COMMITS</text><text class="s v" x="42" y="91">5</text><text class="s l" x="42" y="115">deployed systems whose</text><text class="s l" x="42" y="132">first commit is mine</text></g>
<g class="tl d1"><rect x="255.5" y="20.5" width="218" height="123" rx="10" fill="#ffffff" stroke="#c9d2cb"/><circle class="led" cx="275" cy="42" r="3.5" fill="#067a45"/><text class="m k" x="287" y="46">TESTS</text><text class="s v" x="273" y="91">47%</text><text class="s l" x="273" y="115">of my commits also</text><text class="s l" x="273" y="132">change a test file</text></g>
<g class="tl d2"><rect x="486.5" y="20.5" width="218" height="123" rx="10" fill="#ffffff" stroke="#c9d2cb"/><circle class="led" cx="506" cy="42" r="3.5" fill="#067a45"/><text class="m k" x="518" y="46">COMMITS</text><text class="s v" x="504" y="91">3,048</text><text class="s l" x="504" y="115">to main branches in the</text><text class="s l" x="504" y="132">last 12 months · 34 repos</text></g>
<g class="tl d3"><rect x="717.5" y="20.5" width="218" height="123" rx="10" fill="#ffffff" stroke="#c9d2cb"/><circle class="led" cx="737" cy="42" r="3.5" fill="#067a45"/><text class="m k" x="749" y="46">PULL REQUESTS</text><text class="s v" x="735" y="91">1,056</text><text class="s l" x="735" y="115">merged pull requests</text><text class="s l" x="735" y="132">authored, all repositories</text></g>
<text class="m f" x="480" y="164">SOURCE: GIT AND THE GITHUB API · MEASURED 28 OCT 2026</text>
