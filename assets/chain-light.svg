<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 546" width="960" height="546" role="img" aria-labelledby="t d" fill="none">
<title id="t">From the domain to the product</title>
<desc id="d">From the domain to the product: one verified example per layer, and where it runs. Domain and DNS: two domains I registered and run, with DNS, automatic TLS and HTTP/3 (own domains). Email: a DKIM and DMARC sending domain, and a mail API with SMTP fallback (own site, Job Portal). SMS and DLT: OTP on India’s DLT route (the registry for commercial SMS senders and templates), approved templates only, no free text (Scheduler, BadaBhai). Payments: signed webhooks, idempotent capture and GST invoicing (Job Portal). Servers: AWS Lightsail, Docker Compose, Caddy, Nginx, PM2 and certbot (own sites, RVM CAD). CI/CD: tests gate every deploy, and health checks confirm the release (strikehike.com, Team RVM). Data: idempotent Postgres migrations, row-level security and audit logs (Scheduler, Team RVM). Backend: NestJS, Express, Fastify and FastAPI services in production (across systems). Frontend: React apps on Vite and Next.js apps, and an offline-first PWA for site supervisors (across systems). AI layer: read-only MCP connectors with a bound identity and every call logged (Job Portal, Scheduler). Product: CEO, HR and operations requirements turned into enforced rules (RVM CAD).</desc>
