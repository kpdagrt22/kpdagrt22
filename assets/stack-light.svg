<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" width="960" height="446" role="img" aria-labelledby="t d" fill="none">
<title id="t">Stack</title>
<desc id="d">Stack used in production or public code; daily drivers marked. Languages: TypeScript (daily), JavaScript, Python (daily), SQL and PL/pgSQL. Frontend: Next.js (daily), React, Vite, Tailwind CSS, TanStack Query, Astro, three.js. Backend: Node.js, NestJS, Express and FastAPI (daily), Fastify, OpenAPI, Zod and Pydantic. Data: PostgreSQL, Supabase and Drizzle ORM (daily), row-level security, Redis, SQLite and Parquet. AI systems: MCP servers, OAuth 2.1 with PKCE, Gemini with Claude fallback, encrypted AI traces, scikit-learn. Infra and DevOps: AWS Lightsail, Docker Compose and GitHub Actions (daily), Caddy, Nginx, PM2, GHCR and ECR, Render. Mail, SMS and payments: Resend, mail API with SMTP fallback, DKIM and DMARC, DLT-route SMS OTP, Razorpay. Quality gates: Vitest, pytest, Playwright, axe-core, gitleaks, semgrep, pnpm audit.</desc>
