<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="960" height="170" role="img" aria-labelledby="t d" fill="none">
<title id="t">The small print</title>
<desc id="d">The best engineer money can buy. Runs on one cup of coffee. Not cheap. Mind it.</desc>
<defs><style>.s{font-family:"Inter Tight",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.hd{font-size:11px;letter-spacing:2.2px;fill:#93a098}.l1{font-size:30px;font-weight:700;letter-spacing:-.3px;fill:#e8eee9}.l2{font-size:16px;fill:#93a098}.mind{font-size:16px;font-weight:700;fill:#e8eee9}.ft{font-size:10.5px;letter-spacing:1.4px;fill:#93a098}.hl{fill:#ffb020;opacity:.55;transform-box:fill-box;transform-origin:left center}.wink{transform-box:fill-box;transform-origin:center}@keyframes sp-type{0%{clip-path:inset(0 100% 0 0)}30%,100%{clip-path:inset(0 0 0 0)}}@keyframes sp-sweep{0%,8%{transform:scaleX(0)}28%,100%{transform:scaleX(1)}}@keyframes sp-wink{0%,39%,100%{transform:rotate(0)}43%{transform:rotate(2deg)}47%{transform:rotate(-1deg)}51%{transform:rotate(0)}}@media (prefers-reduced-motion:no-preference){.type{animation:sp-type 6s steps(30,end) infinite both}.hl{animation:sp-sweep 6s cubic-bezier(.16,1,.3,1) infinite both}.wink{animation:sp-wink 6s ease-in-out infinite both}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect x=".5" y=".5" width="959" height="169" rx="14" fill="#050706" stroke="#334039"/>
<circle cx="46" cy="31" r="3" fill="#ff4a3d"/><text class="m hd" x="58" y="35">THE SMALL PRINT</text>
<path d="M40 47.5H920" stroke="#222b26"/>
<rect class="hl" x="94" y="94" width="414" height="9" rx="4.5"/>
<g class="type"><text class="s l1" x="40" y="88">The best engineer money can buy.</text></g>
<text class="s l2" x="40" y="124">Runs on one cup of coffee. Not cheap.</text>
<g class="wink"><text class="s mind" x="372" y="124">Mind it.</text></g>
<text class="m ft" x="920" y="151" text-anchor="end">FUEL: ONE CUP OF COFFEE</text>
