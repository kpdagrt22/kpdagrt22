<title id="t">Prakash Kantumutchu (KP)</title>
<desc id="d">Prakash Kantumutchu (KP), Faridabad, Delhi NCR, India. Technical Product Manager at RVM CAD, where I own, lead and architect its four platforms. Roles: technical lead, backend and data, frontend, DevOps and infrastructure, AI guardrails, architecture, and product management. Former Air India A320 aircraft maintenance engineer. My rule: I verify, then ship.</desc>
